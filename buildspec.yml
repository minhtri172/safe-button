version: 0.2

phases:
  pre_build:
    commands:
      - test -n "$AWS_DEFAULT_REGION"
      - test -n "$ECR_REPOSITORY_NAME"
      - AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
      - ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

      # Create Tags for the image
      - IMAGE_TAG="$(printf '%s' "${CODEBUILD_RESOLVED_SOURCE_VERSION:-$CODEBUILD_BUILD_NUMBER}" | cut -c1-12)" 
      - IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY_NAME}:${IMAGE_TAG}"

      # Log in to ECR
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    commands:
      - docker build -t "$IMAGE_URI" . # build the docker image with the previously defined IMAGE_URI
  post_build:
    commands:
      - docker push "$IMAGE_URI" # push the docker image to ECR
      - sed "s|IMAGE_URI|${IMAGE_URI}|g" k8s-deployment.yaml > rendered-k8s-deployment.yaml # replace IMAGE_URI in k8s deployment file

artifacts: # files in the build artifact
  files:
    - rendered-k8s-deployment.yaml # contains the correct image URI for EKS the deployment