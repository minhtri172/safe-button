version: 0.2

phases:
  install:
    commands:
      - test -n "$EKS_CLUSTER_NAME"
      - test -n "$AWS_DEFAULT_REGION"
      - EKS_VERSION="$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_DEFAULT_REGION" --query 'cluster.version' --output text)"
      - curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v${EKS_VERSION}.0/bin/linux/amd64/kubectl"
      - chmod +x /usr/local/bin/kubectl
  pre_build:
    commands:
      - aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_DEFAULT_REGION"
  build:
    commands:
      - kubectl apply -f rendered-k8s-deployment.yaml
      - kubectl rollout status deployment/safe-button --namespace safe-button --timeout=180s