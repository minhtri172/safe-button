apiVersion: apps/v1
kind: Deployment
metadata:
  name: safe-button
  labels:
    app: safe-button
spec:
  replicas: 1
  selector:
    matchLabels:
      app: safe-button
  template:
    metadata:
      labels:
        app: safe-button
    spec:
      serviceAccountName: my-pod-service-account
      containers:
        - name: safe-button
          image: 119997536442.dkr.ecr.us-east-1.amazonaws.com/safe-button:latest
          imagePullPolicy: Always
          env:
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: CRON_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: safe-button-cron
                  key: CRON_AUTH_TOKEN
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP  
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
