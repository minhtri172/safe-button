apiVersion: apps/v1
kind: Deployment
metadata:
  name: safe-button
  labels:
    app: safe-button
spec:
  replicas: 1
  selector:
    matchLabels:
      app: safe-button
  template:
    metadata:
      labels:
        app: safe-button
    spec:
      serviceAccountName: my-pod-service-account
      containers:
        - name: safe-button
          image: IMAGE_URI
          imagePullPolicy: IfNotPresent
          env:
            - name: COGNITO_CALLBACK_URL
              value: https://okcfisher.click/auth/callback
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: CRON_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: safe-button-cron
                  key: CRON_AUTH_TOKEN
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP  
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: safe-button
  labels:
    app: safe-button
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: arn:aws:acm:us-east-1:119997536442:certificate/a0aa17af-be5c-422c-b820-63a71dd1cd95
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-ssl-negotiation-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
spec:
  type: LoadBalancer
  selector:
    app: safe-button
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https         
      port: 443            
      targetPort: 8080 
      protocol: TCP